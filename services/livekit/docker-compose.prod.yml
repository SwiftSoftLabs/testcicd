# Deploy on production VM only (Hetzner, Oracle, etc.). Not for local Mac.
# LiveKit uses host networking; Redis is published on 127.0.0.1 for agent dispatch.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.runtime.yaml:/etc/livekit.yaml:ro
      - ./keys.yaml:/keys.yaml:ro
      - ./certs/turn.crt:/turn.crt:ro
      - ./certs/turn.key:/turn.key:ro
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit

volumes:
  redis_data:
  caddy_data:
  caddy_config:
